<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="DABNBGw5jpbeLy1lbzXGsw">
<head data-page-node-id="W6eSEjjtpeP7NYKFf4eA1H">
<meta charset="UTF-8" data-page-node-id="1D1IwE0hIIHa0k48Z97gYC"/>
<meta name="viewport" content="width=device-width,initial-scale=1" data-page-node-id="JZdJJfXygGqqfEwCbwtOiS"/>
<title>门店生命周期研究 · 蛙小辣 / 拌客</title>
<style>
:root{
  /* —— 老式麻辣烫海报配色 —— */
  --bg:#FDF5E6;            /* 奶油米 · 页面底色 */
  --bg-deep:#F7E9C8;       /* 深米黄 · 侧栏/主线栏 */
  --card:#FFFFFF;          /* 卡片纯白 */
  --card-alt:#FFFDE7;      /* 淡黄 · 卡片标题栏/结论前置 */
  --line:#E0C79A;          /* 暖色描边 */
  --line-soft:#F0E2C4;
  --text:#3E2723;          /* 深酱棕 · 正文 */
  --text-2:#6D4C41;
  --text-3:#9C8A76;
  --accent:#C62828;        /* 麻辣红 · 标题/核心数据/主色 */
  --accent-dark:#8E1B1B;
  --accent-soft:#FDECEA;
  --up:#C62828;            /* 涨 = 红（中国习惯） */
  --down:#2E7D32;          /* 跌 = 暖松绿 */
  --warn:#EF6C00;          /* 火腿橙 · 副色 */
  --danger:#C62828; --ok:#2E7D32; --info:#1565C0;   /* 串串蓝 · 点缀色 */
  --b1:#C62828; --b2:#EF6C00;
  --dead:#8E1B1B; --alive:#2E7D32;
  --gold:#FBC02D; --blue:#1565C0; --green:#2E7D32; --ink:#3E2723;
  --radius:12px;
  --hard:4px 4px 0 var(--ink);
  --font-display:'ZCOOL KuaiLe','站酷快乐体','华文琥珀','STHupo','Microsoft YaHei',sans-serif;
  --font-num:'Arial Black','Segoe UI Black','Microsoft YaHei','PingFang SC',sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:30;min-height:58px;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:16px;padding:9px 20px;
}
.tb-title{font-size:15px;font-weight:600;letter-spacing:.2px}
.tb-sub{font-size:11.5px;color:var(--text-3);margin-top:1px}
.tb-right{display:flex;align-items:center;gap:14px}
.src{font-size:11px;color:var(--text-3);text-align:right;line-height:1.5;max-width:520px}
.btn{
  border:1px solid var(--line);background:#fff;color:var(--text-2);border-radius:7px;
  padding:6px 13px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;
  transition:background .15s,border-color .15s,color .15s;
}
.btn:hover{background:var(--accent-soft);border-color:#E0B9B2;color:var(--accent-dark)}
.btn:active{transform:translateY(.5px)}
/* ---------- 布局 ---------- */
.layout{display:flex;align-items:flex-start;min-height:calc(100vh - var(--topH,58px) - var(--storyH,0px))}
.side{
  width:212px;flex:0 0 212px;position:sticky;top:calc(var(--topH,58px) + var(--storyH,0px));height:calc(100vh - var(--topH,58px) - var(--storyH,0px));
  overflow-y:auto;padding:16px 12px 24px;border-right:1px solid var(--line);background:#FBF2DE;
}
.side-cap{
  font-size:10.5px;color:var(--text-3);letter-spacing:.6px;font-weight:600;
  padding:0 8px 7px;text-transform:uppercase;
}
.brand-list,.nav-list{display:flex;flex-direction:column;gap:3px}
.brand-btn,.nav-btn{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  border:1px solid transparent;background:transparent;border-radius:7px;
  padding:7px 9px;font-size:12.5px;color:var(--text-2);cursor:pointer;font-family:inherit;
  transition:background .13s,color .13s,border-color .13s;
}
.brand-btn:hover,.nav-btn:hover{background:#F7EACF}
.brand-btn.on,.nav-btn.on{
  background:#fff;color:var(--accent-dark);font-weight:600;
  border-color:#E8C4C0;box-shadow:0 1px 2px rgba(31,41,55,.05);
}
.brand-btn .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.brand-btn .cnt{margin-left:auto;font-size:10.5px;color:var(--text-3);font-weight:400}
.nav-btn .ni{
  width:19px;height:19px;flex:0 0 19px;border-radius:5px;background:#EFE0C0;color:var(--text-3);
  font-size:10.5px;display:flex;align-items:center;justify-content:center;font-weight:600;
}
.nav-btn.on .ni{background:var(--accent);color:#fff}
.main{flex:1 1 auto;min-width:0;padding:16px 18px 40px}
/* ---------- 卡片 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  display:flex;flex-direction:column}
.card-h{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:11px 14px 9px;border-bottom:1px solid var(--line-soft);
}
.card-h .t{font-size:13.5px;font-weight:600}
.card-h .s{font-size:11px;color:var(--text-3);font-weight:400}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.chart{width:100%;height:270px}
.chart.tall{height:320px}
.chart.short{height:220px}
.chart.xtall{height:400px}
/* ---------- 一图一结论 ---------- */
.card>*{flex:0 0 auto}
.chart-note{
  margin-top:auto;display:flex;align-items:flex-start;gap:8px;
  padding:9px 14px 10px;border-top:1px solid var(--line-soft);background:#FFFBF0;
  font-size:12px;line-height:1.6;color:var(--text);
}
.chart-note .nd{flex:0 0 6px;width:6px;height:6px;border-radius:50%;margin-top:6.5px;background:var(--info)}
.chart-note .tx{flex:1;min-width:0}
.chart-note .tx b{font-weight:600}
.chart-note.lv-danger{background:#FDF0EE} .chart-note.lv-danger .nd{background:var(--danger)}
.chart-note.lv-warn{background:#FFF8E1}   .chart-note.lv-warn .nd{background:var(--warn)}
.chart-note.lv-ok{background:#F1F8EC}     .chart-note.lv-ok .nd{background:var(--ok)}
/* 紧凑经验清单 */
.exp-list{display:flex;flex-direction:column}
.exp-row{display:flex;gap:10px;align-items:flex-start;padding:9px 16px;border-bottom:1px solid var(--line-soft)}
.exp-row:last-child{border-bottom:0}
.exp-row .nd{flex:0 0 6px;width:6px;height:6px;border-radius:50%;margin-top:7px;background:var(--info)}
.exp-row.lv-danger .nd{background:var(--danger)}
.exp-row.lv-warn .nd{background:var(--warn)}
.exp-row.lv-ok .nd{background:var(--ok)}
.exp-k{flex:0 0 74px;font-size:11.5px;color:var(--text-3);font-weight:600;padding-top:1px}
.exp-v{flex:1;min-width:0;font-size:12.5px;color:var(--text);line-height:1.6}
.exp-v .hi{font-weight:600;color:var(--accent-dark);font-variant-numeric:tabular-nums}
.exp-v em{font-style:normal;font-weight:600;color:var(--danger)}
.hi{font-weight:600;color:var(--accent-dark);font-variant-numeric:tabular-nums}
/* ---------- 页面头 ---------- */
.pg-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:14px;flex-wrap:wrap}
.pg-title{font-size:17px;font-weight:600;letter-spacing:.2px}
.pg-desc{font-size:12px;color:var(--text-3);margin-top:3px;max-width:900px}
/* ---------- KPI ---------- */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:14px}
.kpi{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 13px 11px;position:relative;overflow:hidden;
}
.kpi .lab{font-size:11px;color:var(--text-3);margin-bottom:5px;display:flex;align-items:center;gap:5px}
.kpi .val{font-size:21px;font-weight:600;letter-spacing:-.3px;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .row{display:flex;align-items:baseline;gap:7px;margin-top:5px;flex-wrap:wrap}
.kpi .note{font-size:10.5px;color:var(--text-3)}
.kpi.warn{background:#FFF8E1;border-color:#F0D9AE}
.kpi.warn .val{color:#A85800}
.kpi.bad{background:#FDF0EE;border-color:#EFC9C4}
.kpi.bad .val{color:var(--danger)}
.kpi.good{background:#F1F8EC;border-color:#C8E0BE}
.kpi.good .val{color:var(--ok)}
.kpi .flag{
  position:absolute;top:0;right:0;font-size:9.5px;padding:2px 7px;border-bottom-left-radius:7px;
  color:#fff;font-weight:600;letter-spacing:.3px;
}
.kpi.bad .flag{background:var(--danger)}
.kpi.warn .flag{background:var(--warn)}
.kpi.good .flag{background:var(--ok)}
.delta{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.delta.up{color:var(--up)} .delta.down{color:var(--down)} .delta.flat{color:var(--text-3)}
.spark{width:58px;height:20px;display:block}
/* ---------- 结论 ---------- */
.ins-wrap{margin-top:14px}
.ins-head{
  display:flex;align-items:center;gap:9px;margin-bottom:9px;
}
.ins-head .t{font-size:13.5px;font-weight:600}
.ins-head .c{font-size:11px;color:var(--text-3)}
.ins-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:11px}
.ins{
  background:#fff;border:1px solid var(--line);border-left-width:3px;border-radius:8px;
  padding:11px 13px 12px;
}
.ins.lv-danger{border-left-color:var(--danger)}
.ins.lv-warn{border-left-color:var(--warn)}
.ins.lv-info{border-left-color:var(--info)}
.ins.lv-ok{border-left-color:var(--ok)}
.ins-t{font-size:12.5px;font-weight:600;margin-bottom:5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tag{
  font-size:9.5px;padding:1px 6px;border-radius:4px;font-weight:600;letter-spacing:.3px;white-space:nowrap;
}
.tag.lv-danger{background:#FBE3E0;color:#8E1B1B}
.tag.lv-warn{background:#FFF3D6;color:#8E5A00}
.tag.lv-info{background:#E7EFFA;color:#0D47A1}
.tag.lv-ok{background:#EDF5E7;color:#1B5E20}
.tag.cat{background:#F0E3C6;color:var(--text-2);font-weight:500}
.ins-b{font-size:12px;color:var(--text-2);line-height:1.68}
.ins-a{margin-top:7px;padding-top:7px;border-top:1px dashed var(--line-soft);font-size:11.5px;color:var(--text-2)}
.ins-a b{color:var(--accent-dark);font-weight:600}
/* ---------- 表格 ---------- */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:12px}
table.tbl th{
  text-align:left;font-weight:600;color:var(--text-3);font-size:11px;
  padding:9px 10px;border-bottom:1px solid var(--line);background:#FBF2DE;white-space:nowrap;
}
table.tbl td{padding:9px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tr:hover td{background:#FFF8E1}
table.tbl td.num,table.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
table.tbl tr.dead td:first-child{border-left:2px solid transparent}
tbody tr.sel td{background:var(--accent-soft)}
.bar-cell{display:flex;align-items:center;gap:7px;min-width:120px}
.bar-cell .bg{flex:1;height:6px;background:#EFE2C6;border-radius:3px;overflow:hidden;min-width:44px}
.bar-cell .fg{height:100%;border-radius:3px}
.surv-tag{
  display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;font-weight:600;
}
.surv-tag.dead{background:#FBE3E0;color:#8E1B1B}
.surv-tag.alive{background:#EDF5E7;color:#1B5E20}
/* ---------- 门店选择器 ---------- */
.store-pick{display:flex;flex-wrap:wrap;gap:7px}
.store-chip{
  border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 11px;
  font-size:12px;color:var(--text-2);cursor:pointer;font-family:inherit;
  display:flex;align-items:center;gap:7px;transition:all .13s;
}
.store-chip:hover{background:#F7EACF;border-color:#E8C4C0}
.store-chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.store-chip .d{width:6px;height:6px;border-radius:50%;flex:0 0 6px}
.store-chip.on .d{background:#fff !important}
/* ---------- 时间轴 ---------- */
.tl{display:flex;flex-direction:column}
.tl-item{display:flex;gap:12px;position:relative;padding-bottom:14px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{
  content:'';position:absolute;left:107px;top:6px;bottom:-8px;width:1px;background:var(--line);
}
.tl-item:last-child::before{display:none}
.tl-date{flex:0 0 100px;font-size:11.5px;color:var(--text-3);font-weight:600;text-align:right;padding-top:1px;font-variant-numeric:tabular-nums}
.tl-dot{
  flex:0 0 9px;width:9px;height:9px;border-radius:50%;margin-top:5px;z-index:1;
  border:2px solid #fff;box-shadow:0 0 0 1px var(--line);
}
.tl-body{flex:1;min-width:0}
.tl-t{font-size:12.5px;font-weight:600;margin-bottom:2px}
.tl-d{font-size:11.5px;color:var(--text-2);line-height:1.62}
/* ---------- 状态提示 ---------- */
.fail{
  background:#fff;border:1px solid #EFC9C4;border-left:3px solid var(--danger);
  border-radius:8px;padding:18px 20px;font-size:13px;color:var(--text-2);line-height:1.8;
}
.fail code{background:#F7E9C8;padding:1px 5px;border-radius:4px;font-size:12px}
.empty{
  padding:26px;text-align:center;color:var(--text-3);font-size:12px;background:#fff;
  border:1px dashed var(--line);border-radius:8px;
}
.mt14{margin-top:14px}
/* ---------- 响应式 ---------- */
@media (max-width:1280px){
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:1000px){
  .layout{flex-direction:column;align-items:stretch}
  .side{
    width:100%;flex:0 0 auto;position:static;height:auto;border-right:none;
    border-bottom:1px solid var(--line);
  }
  .brand-list,.nav-list{flex-direction:row;flex-wrap:wrap}
  .brand-btn,.nav-btn{width:auto}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
}
/* ---------- 本页小结（页面级总结） ---------- */
.sum{
  margin-top:14px;background:var(--card);border:1px solid var(--line);
  border-left:3px solid var(--accent);border-radius:var(--radius);overflow:hidden;
}
.sum-top{display:flex;align-items:center;gap:9px;padding:11px 16px 0;flex-wrap:wrap}
.sum-badge{
  font-size:11px;font-weight:600;color:#fff;background:var(--accent);
  padding:2px 8px;border-radius:4px;letter-spacing:.3px;
}
.sum-meta{font-size:11px;color:var(--text-3)}
.sum-hl{padding:9px 16px 0;font-size:13.5px;font-weight:600;line-height:1.66;color:var(--text)}
.sum-hl b{color:var(--accent-dark);font-weight:600}
.sum-hl b.bad{color:var(--danger)}
.sum-rows{padding:10px 16px 2px;display:flex;flex-direction:column;gap:6px}
.sum-r{display:flex;gap:10px;align-items:flex-start}
.sum-k{flex:0 0 148px;font-size:11.5px;color:var(--text-3);font-weight:600;padding-top:1px}
.sum-v{flex:1;min-width:0;font-size:12.5px;line-height:1.64;color:var(--text-2)}
.sum-v b{font-weight:600;color:var(--text)}
.sum-v b.bad{color:var(--danger)}
.sum-v b.good{color:var(--ok)}
.sum-tail{
  margin-top:9px;padding:9px 16px 10px;border-top:1px dashed var(--line);
  background:#FFFBF0;font-size:12.5px;line-height:1.64;color:var(--text);
}
.sum-tail b{color:var(--accent-dark);font-weight:600}
@media (max-width:700px){.sum-k{flex:0 0 108px}}
/* ---------- 下钻控制条 ---------- */
.ctl{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:11px 14px;margin-bottom:14px;
  display:flex;flex-direction:column;gap:9px}
.ctl-row{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.ctl-lab{flex:0 0 72px;font-size:11.5px;color:var(--text-3);font-weight:600;padding-top:6px}
.ctl-chips{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 11px;font-size:12px;
  color:var(--text-2);cursor:pointer;font-family:inherit;transition:all .13s;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px}
.chip:hover{background:#F7EACF;border-color:#E8C4C0}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.chip .sub{font-size:10px;color:var(--text-3)}
.chip.on .sub{color:rgba(255,255,255,.82)}
.chip .cd{width:6px;height:6px;border-radius:50%;flex:0 0 6px}
.sel{border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:12px;font-family:inherit;
  color:var(--text);background:#fff;cursor:pointer;max-width:230px}
.ctl-tip{font-size:11px;color:var(--text-3);padding-top:2px}

/* ---------- 口径提示条 ---------- */
.gap-note{display:flex;gap:9px;align-items:flex-start;background:#FFF6E0;border:1px solid #E8D3A8;
  border-left:3px solid var(--warn);border-radius:8px;padding:9px 13px;font-size:11.5px;line-height:1.66;
  color:#6B4E1E;margin-bottom:14px}
.gap-note .gn-i{flex:0 0 auto;font-weight:600;color:#8E5A00}
.gap-note b{color:#8E5A00;font-weight:600}

/* ---------- 动作清单 ---------- */
.acts{display:flex;flex-direction:column}
.act{display:flex;gap:11px;padding:10px 16px;border-bottom:1px solid var(--line-soft)}
.act:last-child{border-bottom:0}
.act .k{flex:0 0 auto;min-width:26px;height:18px;padding:0 5px;border-radius:4px;background:var(--accent-soft);
  color:var(--accent-dark);font-size:10.5px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:2px}
.act .k.o{background:#E7EFFA;color:#0D47A1}
.act .k.f{background:#FFF3D6;color:#8E5A00}
.act .b{flex:1;min-width:0;font-size:12.5px;line-height:1.64;color:var(--text-2)}
.act .b b{color:var(--text);font-weight:600}
.act .b em{font-style:normal;color:var(--accent-dark);font-weight:600}
.act .b .hi2{font-weight:600;color:var(--accent-dark);font-variant-numeric:tabular-nums}
.badge-o{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;font-weight:600;
  background:#E7EFFA;color:#0D47A1;white-space:nowrap}
.badge-f{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;font-weight:600;
  background:#FFF3D6;color:#8E5A00;white-space:nowrap}

/* ---------- 处方等级标签 ---------- */
.rx{display:inline-block;font-size:10px;padding:1px 7px;border-radius:4px;font-weight:600;white-space:nowrap}
.rx.danger{background:#FBE3E0;color:#8E1B1B}
.rx.warn{background:#FFF3D6;color:#8E5A00}
.rx.ok{background:#EDF5E7;color:#1B5E20}
.rx.info{background:#E7EFFA;color:#0D47A1}

/* ---------- 同环比单元格 ---------- */
table.tbl td.tight{padding:7px 10px}
table.tbl th.grp,table.tbl td.grp{border-left:1px solid var(--line-soft)}
.mono{font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--text-3);margin-bottom:14px}
.legend .li{display:flex;align-items:center;gap:5px}
.legend .sw{width:9px;height:9px;border-radius:2px;display:inline-block}
/* ==========================================================================
   分析主线：五步闭环（顶栏进度条 + 侧栏分阶段导航 + 结论前置）
   ========================================================================== */
.storybar{position:sticky;top:var(--topH,58px);z-index:29;background:#fff;border-bottom:1px solid var(--line);padding:0 20px}
.sb-in{display:flex;align-items:center;height:46px;overflow-x:auto;scrollbar-width:none}
.sb-in::-webkit-scrollbar{display:none}
.sb-cap{font-size:10.5px;color:var(--text-3);font-weight:600;letter-spacing:.6px;padding-right:12px;margin-right:12px;white-space:nowrap;border-right:1px solid var(--line)}
.sb-step{display:flex;align-items:center;gap:7px;border:1px solid transparent;background:transparent;font-family:inherit;cursor:pointer;padding:5px 10px;border-radius:8px;color:var(--text-3);white-space:nowrap;transition:background .13s,color .13s,border-color .13s}
.sb-step i{width:18px;height:18px;flex:0 0 18px;border-radius:50%;background:#EFE0C0;color:var(--text-3);font-size:10.5px;font-style:normal;display:flex;align-items:center;justify-content:center;font-weight:700}
.sb-step b{font-size:12.5px;font-weight:600}
.sb-step em{font-size:11px;font-style:normal;opacity:.85}
.sb-step:hover{background:#F7EACF}
.sb-step.done i{background:#C8E0BE;color:#1B5E20}
.sb-step.on{background:var(--accent-soft);border-color:#E8C4C0;color:var(--accent-dark)}
.sb-step.on i{background:var(--accent);color:#fff}
.sb-arrow{color:#C9B896;font-size:10px;padding:0 1px;user-select:none}
.sb-loop{font-size:10.5px;color:var(--text-3);border:1px dashed var(--line);border-radius:20px;padding:2px 9px;margin-left:10px;white-space:nowrap}

.nav-stage{display:flex;align-items:baseline;gap:6px;padding:11px 8px 3px;margin-top:5px;border-top:1px solid var(--line-soft)}
.nav-stage.first{border-top:0;margin-top:1px;padding-top:2px}
.nav-stage .nn{font-size:10.5px;font-weight:700;color:var(--accent)}
.nav-stage .nm{font-size:11.5px;font-weight:700;color:var(--text-2)}
.nav-stage .ns{margin-left:auto;font-size:10px;color:var(--text-3)}

/* ---------- 结论前置（BLUF） ---------- */
.lead{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--radius);padding:13px 16px 12px;margin-bottom:14px}
.lead-hd{display:flex;align-items:center;gap:9px;margin-bottom:8px;flex-wrap:wrap}
.lead-badge{font-size:10.5px;font-weight:700;color:#fff;background:var(--accent);border-radius:5px;padding:2px 8px;letter-spacing:.4px}
.lead-stage{font-size:10.5px;color:var(--text-3);font-weight:600}
.lead-hl{font-size:13.5px;line-height:1.75;font-weight:500}
.lead-hl b{color:var(--accent-dark);font-weight:700}
.lead-hl b.bad{color:var(--danger)}
.lead-hl b.good{color:var(--ok)}
.lead-pts{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:5px;list-style:none}
.lead-pts li{font-size:12px;color:var(--text-2);line-height:1.62;padding-left:16px;position:relative}
.lead-pts li:before{content:"\25B8";position:absolute;left:3px;top:-1px;color:var(--accent);font-size:11px}
.lead-pts li b{color:var(--text);font-weight:600}

/* ---------- 效果追踪页 ---------- */
.freq{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;background:#F2E6CB;color:var(--text-2);font-weight:600;white-space:nowrap}
.freq.w{background:#FDE4DC;color:#A8452F}
.freq.m{background:#E7EFFA;color:var(--accent-dark)}
.pbar{height:6px;border-radius:3px;background:#EFE2C6;overflow:hidden;display:block;min-width:60px;margin-top:5px}
.pbar>i{display:block;height:100%;border-radius:3px}
.loop-box{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.loop-i{background:#FFFBF0;border:1px solid var(--line-soft);border-radius:8px;padding:10px 11px}
.loop-i .n{font-size:10.5px;font-weight:700;color:var(--accent);margin-bottom:3px}
.loop-i .t{font-size:12.5px;font-weight:600;margin-bottom:3px}
.loop-i .d{font-size:11.5px;color:var(--text-2);line-height:1.55}
.loop-i.now{background:var(--accent-soft);border-color:#E8C4C0}
@media (max-width:900px){.loop-box{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- 0. 纸质底纹与滚动条 ---------- */

/* ---------- 1. 顶栏：红油招牌 ---------- */

     3px  3px 0 rgba(62,39,35,.55);

  box-shadow:3px 3px 0 rgba(62,39,35,.5);
  transition:background .12s,transform .12s,box-shadow .12s,color .12s;
}
.btn:hover{
  background:var(--gold);border-color:#7F1010;color:var(--ink);
  transform:translate(-1px,-1px);box-shadow:4px 4px 0 rgba(62,39,35,.55);

/* ---------- 2. 主线进度条 ---------- */
.storybar{background:var(--bg-deep);border-bottom:2px solid var(--line);box-shadow:0 2px 0 rgba(62,39,35,.05)}

}

/* ---------- 3. 侧栏 ---------- */

}

/* ---------- 6. 卡片：复古硬边框 + 硬阴影 ---------- */

<script>
/* ==========================================================================
   1. 数据层
   ========================================================================== */
var D = window.DASH_DATA || null;
var DATES = [], STORES = [], PLATFORMS = [], BRANDS = [], SHOP = [], CPC = [];
var MONTHS = [], MIDX = {};

// 商圈/区域映射（按门店简称）
var AREA = {
  '宝山店': '宝山', '五角场店': '杨浦·五角场', '武宁路店': '普陀·武宁路',
  '怒江路店': '普陀·怒江路', '虹口足球场店': '虹口·足球场', '真如店': '普陀·真如',
  '龙阳广场店': '浦东·龙阳路', '大宁店': '静安·大宁', '龙阳路店': '浦东·龙阳路',
  '交大店': '徐汇·交大'
};
var BCOLOR = { '蛙小辣': '#C62828', '拌客': '#EF6C00' };
var PALETTE = ['#C62828', '#EF6C00', '#FBC02D', '#8E1B1B', '#D84315', '#F57C00', '#6D4C41', '#1565C0'];
var C_DEAD = '#C62828', C_ALIVE = '#2E7D32';
// 疫情关键节点
var COVID = [
  { d: '2020-01-23', t: '武汉封城' },
  { d: '2020-02-01', t: '堂食停摆' },
  { d: '2020-03-01', t: '复工限流' }
];
// 疫情分界日：早于此日停业 = 疫情前自主收缩（按日期判定，不能按月，否则 2020-01-22 会被误判）
var COVID_CUT = COVID[0].d;

function parseD(s) { var p = String(s).split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); }
function dayDiff(a, b) { return Math.round((parseD(b) - parseD(a)) / 86400000); }
function dstr(s) { return s; }
function dShort(s) { return s.slice(2); }

function initData() {
  if (!D) return false;
  DATES = D.dates; PLATFORMS = D.platforms; BRANDS = D.brands;
  SHOP = D.shop; CPC = D.cpc;
  MONTHS = []; MIDX = {};
  for (var i = 0; i < DATES.length; i++) {
    var k = DATES[i].slice(0, 7);
    if (!(k in MIDX)) { MIDX[k] = MONTHS.length; MONTHS.push(k); }
  }
  var lastDate = DATES[DATES.length - 1];
  STORES = D.stores.map(function (st, i) {
    var short = st.name.indexOf('-') >= 0 ? st.name.slice(st.name.indexOf('-') + 1) : st.name;
    return {
      si: i, name: st.name, short: short, brand: st.brand,
      area: AREA[short] || short, ids: st.ids,
      first: st.first, last: st.last, days: st.days,
      cal: dayDiff(st.first, st.last) + 1,
      alive: st.last === lastDate,
      m0: st.first.slice(0, 7), m1: st.last.slice(0, 7),
      mi0: MIDX[st.first.slice(0, 7)], mi1: MIDX[st.last.slice(0, 7)]
    };
  });
  return true;
}

/* ---- 聚合 ---- */
function blankA() {
  return { gmv: 0, income: 0, msub: 0, psub: 0, exp: 0, visit: 0, order: 0,
           valid: 0, invalid: 0, cost: 0, cexp: 0, cvisit: 0, nShop: 0, nCpc: 0 };
}
function addShop(a, r) {
  a.gmv += r[3]; a.income += r[4]; a.msub += r[5]; a.psub += r[6];
  a.exp += r[7]; a.visit += r[8]; a.order += r[9]; a.valid += r[10]; a.invalid += r[11];
  a.nShop++;
}
function addCpc(a, r) { a.cost += r[3]; a.cexp += r[4]; a.cvisit += r[5]; a.nCpc++; }

function met(a) {
  var m = {
    gmv: a.gmv, income: a.income, sub: a.msub + a.psub, msub: a.msub, psub: a.psub,
    commission: a.gmv - a.income - a.msub - a.psub,
    exp: a.exp, visit: a.visit, order: a.order, valid: a.valid, invalid: a.invalid,
    cost: a.cost, cexp: a.cexp, cvisit: a.cvisit
  };
  m.incomeRate = a.gmv ? a.income / a.gmv : 0;
  m.subRate = a.gmv ? (a.msub + a.psub) / a.gmv : 0;
  m.mSubRate = a.gmv ? a.msub / a.gmv : 0;
  m.pSubRate = a.gmv ? a.psub / a.gmv : 0;
  m.commissionRate = a.gmv ? m.commission / a.gmv : 0;
  m.mSubShare = (a.msub + a.psub) ? a.msub / (a.msub + a.psub) : 0;
  m.visitRate = a.exp ? a.visit / a.exp : 0;
  m.orderRate = a.visit ? a.order / a.visit : 0;
  m.validRate = (a.valid + a.invalid) ? a.valid / (a.valid + a.invalid) : 0;
  m.aov = a.valid ? a.gmv / a.valid : 0;
  m.visitCost = a.cvisit ? a.cost / a.cvisit : 0;
  m.paidShare = a.visit ? a.cvisit / a.visit : 0;
  m.paidRoi = (a.cost && a.visit) ? (a.gmv * (a.cvisit / a.visit)) / a.cost : 0;
  return m;
}

/* ---- 取数范围 ---- */
function brandStores() {
  if (STATE.brand === 'ALL') return STORES.slice();
  return STORES.filter(function (s) { return s.brand === STATE.brand; });
}
function pick(rows, siSet, from, to) {
  var out = [];
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    if (siSet && !siSet[r[1]]) continue;
    if (from != null && r[0] < from) continue;
    if (to != null && r[0] > to) continue;
    out.push(r);
  }
  return out;
}
function scopeAgg(sis, from, to) {
  var set = {}; for (var i = 0; i < sis.length; i++) set[sis[i]] = true;
  var a = blankA();
  var sr = pick(SHOP, set, from, to); for (i = 0; i < sr.length; i++) addShop(a, sr[i]);
  var cr = pick(CPC, set, from, to); for (i = 0; i < cr.length; i++) addCpc(a, cr[i]);
  return a;
}
function storeAgg(s) {
  return met(scopeAgg([s.si], null, null));
}
function view() {
  var sts = brandStores();
  var sis = sts.map(function (s) { return s.si; });
  var a = scopeAgg(sis, null, null);
  return { stores: sts, sis: sis, a: a, m: met(a) };
}

/* ---- 月度序列 ---- */
function monthSeries(sis, field) {
  var set = {}; for (var i = 0; i < sis.length; i++) set[sis[i]] = true;
  var buckets = MONTHS.map(function () { return blankA(); });
  for (i = 0; i < SHOP.length; i++) {
    var r = SHOP[i];
    if (!set[r[1]]) continue;
    addShop(buckets[MIDX[DATES[r[0]].slice(0, 7)]], r);
  }
  for (i = 0; i < CPC.length; i++) {
    var c = CPC[i];
    if (!set[c[1]]) continue;
    addCpc(buckets[MIDX[DATES[c[0]].slice(0, 7)]], c);
  }
  return buckets.map(function (b) { return met(b); });
}
// 仅保留品牌有门店在营的月份（避免头尾空档）
function activeRange(sts) {
  var a = 1e9, b = -1;
  for (var i = 0; i < sts.length; i++) { a = Math.min(a, sts[i].mi0); b = Math.max(b, sts[i].mi1); }
  return [a < 1e9 ? a : 0, b];
}
// 在营门店数（按月）
function aliveCount(sts) {
  var out = [];
  for (var mi = 0; mi < MONTHS.length; mi++) {
    var n = 0;
    for (var i = 0; i < sts.length; i++) if (sts[i].mi0 <= mi && sts[i].mi1 >= mi) n++;
    out.push(n);
  }
  return out;
}
// 某月各店 GMV
function monthStoreGmv(sis, mi) {
  var mk = MONTHS[mi];
  var out = {};
  for (var i = 0; i < SHOP.length; i++) {
    var r = SHOP[i];
    if (DATES[r[0]].slice(0, 7) !== mk) continue;
    if (sis.indexOf(r[1]) < 0) continue;
    out[r[1]] = (out[r[1]] || 0) + r[3];
  }
  return out;
}

/* ==========================================================================
   2. 格式化与小组件
   ========================================================================== */
function fMoney(v, dp) {
  if (v == null || isNaN(v)) return '--';
  var s = Math.abs(v) >= 10000
    ? (v / 10000).toFixed(dp == null ? 1 : dp) + ' 万'
    : Math.round(v).toLocaleString('zh-CN');
  return '¥' + s;
}
function fMoneyRaw(v) {
  if (v == null || isNaN(v)) return '--';
  return '¥' + Math.round(v).toLocaleString('zh-CN');
}
function fNum(v) { return v == null || isNaN(v) ? '--' : Math.round(v).toLocaleString('zh-CN'); }
function fPct(v, dp) { return v == null || isNaN(v) ? '--' : (v * 100).toFixed(dp == null ? 1 : dp) + '%'; }
function delta(cur, prev) { return (!prev) ? null : (cur - prev) / prev; }
function deltaHTML(d, label) {
  if (d === null || d === undefined || isNaN(d)) return '<span class="note">无对比期</span>';
  var cls = d > 0.001 ? 'up' : (d < -0.001 ? 'down' : 'flat');
  var ar = d > 0 ? '▲' : (d < 0 ? '▼' : '·');
  return '<span class="delta ' + cls + '">' + ar + ' ' + (d * 100).toFixed(1) + '%</span>' +
    (label ? '<span class="note">' + label + '</span>' : '');
}
function sparkSVG(vals, color) {
  if (!vals || vals.length < 2) return '';
  var w = 58, h = 20;
  var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals), rg = (mx - mn) || 1;
  var pts = [];
  for (var i = 0; i < vals.length; i++) {
    pts.push((i / (vals.length - 1) * w).toFixed(1) + ',' + (h - 2 - (vals[i] - mn) / rg * (h - 4)).toFixed(1));
  }
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
    '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + color +
    '" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}
function kpiHTML(items) {
  var h = '<div class="kpi-row">';
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    h += '<div class="kpi ' + (it.state || '') + '">' +
      (it.flag ? '<div class="flag">' + it.flag + '</div>' : '') +
      '<div class="lab">' + it.label + '</div>' +
      '<div class="val">' + it.value + '</div>' +
      '<div class="row">' + (it.deltaHTML || (it.delta !== undefined ? deltaHTML(it.delta) : '')) +
      (it.note ? '<span class="note">' + it.note + '</span>' : '') + '</div></div>';
  }
  return h + '</div>';
}
/* 图表下方的「一图一结论」结论条 */
function noteHTML(note) {
  if (!note) return '';
  var lv = typeof note === 'string' ? 'info' : (note.level || 'info');
  var tx = typeof note === 'string' ? note : note.text;
  if (!tx) return '';
  return '<div class="chart-note lv-' + lv + '"><span class="nd"></span><span class="tx">' + tx + '</span></div>';
}
function cardHTML(id, title, sub, cls, note) {
  return '<div class="card"><div class="card-h"><div class="t">' + title + '</div>' +
    (sub ? '<div class="s">' + sub + '</div>' : '') + '</div>' +
    '<div class="chart ' + (cls || '') + '" id="' + id + '"></div>' + noteHTML(note) + '</div>';
}
/* ==========================================================================
   4b. 本页小结：基于本页图表给出总结性分析，固定放在页面最下方
   ========================================================================== */
function sumRow(k, v) {
  return '<div class="sum-r"><span class="sum-k">' + k + '</span><span class="sum-v">' + v + '</span></div>';
}
function sumParts(V, page, extra) {
  var sts = storeStats(V);
  if (!sts || !sts.length) return '';
  var m = V.m, n = sts.length;
  var brandLabel = STATE.brand === 'ALL' ? '全部品牌' : STATE.brand;
  var dead = sts.filter(function (x) { return !x.alive; });
  var hl = '', rows = [], tail = '', meta = '';
  var i;

  /* ---------------- 页面 1：经营全貌 ---------------- */
  if (page === 'overview') {
    var gmvS = monthSeries(V.sis).map(function (z) { return z.gmv; });
    var aliveS = aliveCount(V.stores);
    var pkV = -1, pkMi = 0;
    for (i = 0; i < gmvS.length; i++) if (gmvS[i] > pkV) { pkV = gmvS[i]; pkMi = i; }
    var loV = Infinity, loMi = pkMi;
    for (i = pkMi; i < gmvS.length; i++) if (gmvS[i] > 0 && gmvS[i] < loV) { loV = gmvS[i]; loMi = i; }
    var drop = pkV ? (loV - pkV) / pkV : 0;
    var minD = Math.min.apply(null, sts.map(function (x) { return x.days; }));
    var medDays = median(sts.map(function (x) { return x.days; }));
    var maxAlive = Math.max.apply(null, aliveS);
    var endAlive = sts.filter(function (x) { return x.alive; }).length;

    meta = '基于本页 3 张图：门店生死榜 / 品牌规模与让利结构 / 月度 GMV 与在营门店数 · 口径：' + brandLabel;
    hl = '<b class="bad">' + dead.length + '/' + n + ' 家</b>门店已停业、存活中位数仅 <b class="bad">' +
      Math.round(medDays) + ' 天</b> —— 它不是被某一次外部冲击打倒的，' +
      '而是「让利换规模」的单店模型<b>从第一天起就不成立</b>。';
    if (n === 1) hl = '当前筛选下只有 <b>1 家</b>门店：存活 <b>' + sts[0].days + ' 天</b>、累计 GMV <b>' + fMoney(m.gmv) +
      '</b>。个案不足以证明「成批退出」，但单店模型的问题依旧成立 —— 实收率只有 <b class="bad">' + fPct(m.incomeRate) + '</b>。';
    rows = [
      sumRow('翻车盘点 · 生死榜', n === 1
        ? '仅 1 家门店，存活 <b>' + sts[0].days + ' 天</b>（' + sts[0].s.first + ' ~ ' + sts[0].s.last + '），' + (sts[0].alive ? '存续至数据末。' : '数据末期已停业。')
        : '最短只活了 <b>' + minD + ' 天</b>，' + dead.length + ' 家关门、只有 <b>' + endAlive + ' 家</b>撑到最后 —— 门店是<b>成批</b>消失的，不像自然淘汰。'),
      sumRow('让利结构 · 每 100 块怎么分', '累计 GMV <b>' + fMoney(m.gmv) + '</b> 看着不小，但商家实收率只有 <b class="bad">' +
        fPct(m.incomeRate) + '</b>（每卖 ¥100 只拿回 ¥' + (m.incomeRate * 100).toFixed(0) +
        '）；补贴率高达 <b>' + fPct(m.subRate) + '</b>，其中商家自掏 <b class="bad">' + fPct(m.mSubShare) + '</b>。'),
      sumRow('月度流水与在营门店', 'GMV 于 <b>' + MONTHS[pkMi] + '</b> 见顶 ' + fMoneyRaw(pkV) + '，到 ' +
        MONTHS[loMi] + ' 只剩 ' + fMoneyRaw(loV) + '（<b class="bad">' + fPct(drop, 0) + '</b>）；在营门店由 <b>' +
        maxAlive + ' 家</b>收缩到 <b>' + endAlive + ' 家</b>。')
    ];
    tail = '规模是靠让利买来的 —— 让利一停、或现金一断，规模立刻消失。复盘的落点应该在<b>单店模型能否自负盈亏</b>，而不是门店执行好坏。';
  }

  /* ---------------- 页面 2：生命周期时间线 ---------------- */
  else if (page === 'timeline') {
    var tlo = Math.min.apply(null, V.stores.map(function (x) { return x.mi0; }));
    var thi = Math.max.apply(null, V.stores.map(function (x) { return x.mi1; }));
    var tAlive = aliveCount(V.stores).slice(tlo, thi + 1);
    var pre = dead.filter(function (x) { return x.last < COVID_CUT; }).length;
    var post = dead.length - pre;
    var mxA = Math.max.apply(null, tAlive), mxAmi = tAlive.indexOf(mxA);
    var endA = tAlive.length ? tAlive[tAlive.length - 1] : 0;
    var endReal = sts.filter(function (x) { return x.alive; }).length;
    var byM = {};
    dead.forEach(function (x) { var k = x.last.slice(0, 7); (byM[k] = byM[k] || []).push(x); });
    var ck = Object.keys(byM).sort(), mxC = 0, mxCK = '';
    ck.forEach(function (k) { if (byM[k].length > mxC) { mxC = byM[k].length; mxCK = k; } });

    meta = '基于本页 3 图 1 表：存续甘特 / 在营门店数 / 停业分布 / 停业归堆明细 · 口径：' + brandLabel;
    hl = '关店潮发生在疫情<b>之前</b>：' + dead.length + ' 家停业门店中有 <b class="bad">' + pre + ' 家</b>在 ' +
      COVID_CUT + ' 封城之前就已经关闭 —— 疫情只是把残局彻底清零，<b>它不是原因</b>。';
    if (!dead.length) hl = '当前筛选下 ' + n + ' 家门店全部存续至数据末，没有发生停业 —— 这一页看不到关店过程。';
    else if (pre === 0) hl = dead.length + ' 家停业门店全部落在疫情<b>之后</b>（' + COVID_CUT + ' 封城后），与全盘口径不同 —— 需要在外部冲击与自身模型之间做区分。';
    rows = [
      sumRow('门店存续区间（甘特）', n === 1
        ? '仅 1 家门店，区间为 <b>' + sts[0].s.first + ' ~ ' + sts[0].s.last + '</b>，' + (post ? '停业发生在封城（' + COVID_CUT + '）之后。' : '停业发生在封城之前。')
        : '<b>' + pre + ' 家</b>在封城（' + COVID_CUT + '）前停业、仅 <b>' + post + ' 家</b>落在疫情之后；各家区间高度重叠，是「成批开、成批关」的节奏。'),
      sumRow('在营门店数逐月变化', n === 1
        ? '仅 1 家门店，' + MONTHS[tlo + mxAmi] + ' 触顶后在 ' + MONTHS[thi] + ' 归零。'
        : MONTHS[tlo + mxAmi] + ' 触顶 <b>' + mxA + ' 家</b>后单边下行，' + MONTHS[thi] + ' 只剩 <b class="bad">' + endA + ' 家</b>，其中仅 <b>' + endReal + ' 家</b>真正存续至数据末。'),
      sumRow('关门月份分布', '关店高峰是 <b>' + (mxCK || '--') + '</b>（' + mxC + ' 家），落在疫情之前；疫情之后的关店只是零星收尾。'),
      sumRow('停业归堆明细', '全部停业集中在 <b>' + ck.length + ' 个月</b>内完成，节奏非常急促 —— 更像<b>集中止损</b>，不是自然淘汰。')
    ];
    tail = '把结局归因于疫情会完全误判病根：真正的问题在 2019 年就已经写定 —— 门店没跑通就开，钱烧完了就关。';
  }

  /* ---------------- 页面 3：扩张与关店节奏 ---------------- */
  else if (page === 'expansion') {
    var op = {}, cl = {};

  var dead = sts.filter(function (x) { return !x.alive; });
  var avgDays = sts.reduce(function (a, x) { return a + x.days; }, 0) / n;
  var medDays = median(sts.map(function (x) { return x.days; }));
  var medIncome = median(sts.map(function (x) { return x.perMonthIncome; }));
  var under90 = sts.filter(function (x) { return x.days < 90; }).length;
  var gmvS = monthSeries(V.sis).map(function (x) { return x.gmv; });
  var aliveS = aliveCount(V.stores).slice();

  // 生死榜：按存活天数降序
  var rank = sts.slice().sort(function (a, b) { return a.days - b.days; });

  // 品牌对照
  var bs = brandStats();
  var showBs = STATE.brand === 'ALL' ? bs : bs.filter(function (x) { return x.brand === STATE.brand; });

  // ---- 一图一结论 ----
  var minDays = Math.min.apply(null, sts.map(function (x) { return x.days; }));
  var minSt = sts.filter(function (x) { return x.days === minDays; })[0];
  var pkV = -1, pkMi = 0, q;
  for (q = 0; q < gmvS.length; q++) if (gmvS[q] > pkV) { pkV = gmvS[q]; pkMi = q; }
  var loV = Infinity, loMi = pkMi;
  for (q = pkMi; q < gmvS.length; q++) if (gmvS[q] > 0 && gmvS[q] < loV) { loV = gmvS[q]; loMi = q; }
  var dropPct = pkV ? (loV - pkV) / pkV : 0;
  var nAliveEnd = sts.filter(function (x) { return x.alive; }).length;
  var mxAlive = Math.max.apply(null, aliveS);

  var noteRank = { level: medDays < 90 ? 'danger' : 'warn',
    text: '<b>' + dead.length + '/' + n + '</b> 家已停业，存活中位数仅 <b>' + Math.round(medDays) + ' 天</b>' +
      (minSt ? '，最短 <b>' + minDays + ' 天</b>（' + minSt.short + '）' : '') + ' —— 绝大多数门店没活过 3 个月。' };
  var noteBrand = { level: m.incomeRate < 0.45 ? 'danger' : 'warn',
    text: '实收率 <b>' + fPct(m.incomeRate) + '</b>：每卖出 ¥100 只拿回 <b>¥' + (m.incomeRate * 100).toFixed(0) +
      '</b>，规模做得再大也留不下现金流。' };
  var noteTrend = { level: 'danger',
    text: 'GMV 于 <b>' + MONTHS[pkMi] + '</b> 见顶 ' + fMoneyRaw(pkV) + '，到 ' + MONTHS[loMi] + ' 只剩 ' + fMoneyRaw(loV) +
      '（<b>' + fPct(dropPct, 0) + '</b>）；在营门店同步从 <b>' + mxAlive + ' 家</b>收缩到 <b>' + nAliveEnd + ' 家</b>。' };

  var html = shell('经营全貌',
    '先看结局：' + n + ' 家门店中 ' + dead.length + ' 家已停业，' + nAliveEnd + ' 家存续至数据末。',
    kpiHTML([
      { label: '曾开门店', value: n + ' 家', note: '品牌：' + (STATE.brand === 'ALL' ? BRANDS.join(' / ') : STATE.brand) },
      { label: '翻车盘点', value: dead.length + ' 家', state: dead.length / n > 0.6 ? 'bad' : 'warn',
        flag: fPct(dead.length / n, 0) + ' 关停', note: '还活着 ' + (n - dead.length) + ' 家' },
      { label: '平均存活', value: Math.round(avgDays) + ' 天', state: avgDays < 120 ? 'bad' : 'warn',
        note: '中位数仅 ' + Math.round(medDays) + ' 天' },
      { label: '活不过 90 天', value: under90 + ' 家', state: under90 / n > 0.5 ? 'bad' : 'warn',
        note: fPct(under90 / n, 0) + ' 的门店' },
      { label: '招牌大单 · 累计GMV', value: fMoney(m.gmv), note: '有效订单 ' + fNum(m.valid) },
      { label: '到手率（商家实收率）', value: fPct(m.incomeRate), state: m.incomeRate < 0.5 ? 'bad' : 'warn',
        flag: '致命', note: '卖 ¥100 只拿回 ¥' + (m.incomeRate * 100).toFixed(0) },
      { label: '单店月均到手', value: fMoney(medIncome, 1), state: medIncome < 30000 ? 'bad' : 'warn',
        note: '中位数 · 覆盖不了固定成本' }
    ]) +
    '<div class="grid2">' +
      cardHTML('ovRank', '翻车盘点 · 生死榜', '横条＝存活天数 · 颜色＝结局', 'tall', noteRank) +
      cardHTML('ovBrand', '让利结构 · 每 100 块怎么分', '柱：GMV / 商家实收 · 线：实收率', 'tall', noteBrand) +
    '</div>' +
    '<div class="mt14">' +
      cardHTML('ovTrend', '月度流水与在营门店', '柱：GMV（左轴）· 线：在营门店数（右轴）· 红色虚线为疫情节点', 'tall', noteTrend) +
    '</div>' +
    sumHTML(V, 'overview')
  );

  return {
    html: html,
    init: function () {
      // 生死榜
      mount('ovRank', Object.assign({
        tooltip: Object.assign(tipItem(), {
          formatter: function (a) {
            var x = rank[a.dataIndex];
            return '<b>' + x.name + '</b>（' + x.brand + '）<br/>存活 ' + x.days + ' 天（日历 ' + x.cal + ' 天）<br/>' +
              x.first + ' ~ ' + x.last + '<br/>' + (x.alive ? '存续至数据末' : '翻车盘点') +
              '<br/>累计 GMV ' + fMoneyRaw(x.m.gmv) + '<br/>月均实收 ' + fMoneyRaw(x.perMonthIncome);
          }
        }),
        legend: { show: false },
        grid: { left: 6, right: 40, top: 12, bottom: 4, containLabel: true },
        xAxis: yAxis('存活天数'),
        yAxis: { type: 'category', data: rank.map(function (x) { return x.short; }),
          axisLabel: AXIS_LABEL, axisLine: AXIS_LINE, axisTick: { show: false } },
        series: [{
          type: 'bar', barMaxWidth: 15,
          data: rank.map(function (x) {
            return { value: x.days, itemStyle: { color: x.alive ? C_ALIVE : C_DEAD, borderRadius: [0, 3, 3, 0] } };
          }),
          label: { show: true, position: 'right', color: '#6D4C41', fontSize: 11,
            formatter: function (a) { return a.value + ' 天'; } }
        }]
      }));
      // 品牌对照
      mount('ovBrand', Object.assign({
        tooltip: tipItem(),
        legend: legendOf(['GMV', '商家实收', '实收率']),
        grid: gridOf(38),
        xAxis: { type: 'category', data: showBs.map(function (x) { return x.brand; }),
          axisLabel: AXIS_LABEL, axisLine: AXIS_LINE, axisTick: { show: false } },
        yAxis: [yAxis('金额', function (v) { return (v / 10000).toFixed(0) + '万'; }), yAxisPct('实收率')],
        series: [
          { name: 'GMV', type: 'bar', data: showBs.map(function (x) { return Math.round(x.a.gmv); }),
            barMaxWidth: 40, itemStyle: { color: '#F5B942', borderRadius: [3, 3, 0, 0] } },
          { name: '商家实收', type: 'bar', data: showBs.map(function (x) { return Math.round(x.a.income); }),
            barMaxWidth: 40, itemStyle: { color: '#C62828', borderRadius: [3, 3, 0, 0] } },
          { name: '实收率', type: 'line', yAxisIndex: 1, data: showBs.map(function (x) { return +x.m.incomeRate.toFixed(4); }),
            symbolSize: 8, lineStyle: { width: 2, color: '#C62828' }, itemStyle: { color: '#C62828' },
            label: { show: true, formatter: function (a) { return (a.value * 100).toFixed(1) + '%'; },
              color: '#C62828', fontSize: 11 } }
        ]
      }));
      // 月度趋势
      var lo = Math.min.apply(null, V.stores.map(function (s) { return s.mi0; }));
      var hi = Math.max.apply(null, V.stores.map(function (s) { return s.mi1; }));
      var labels = MONTHS.slice(lo, hi + 1);
      var gS = gmvS.slice(lo, hi + 1) || [];
      var aS = aliveS ? aliveS.slice(lo, hi + 1) : [];
      mount('ovTrend', Object.assign({
        tooltip: tipItem(),
        legend: legendOf(['月度 GMV', '在营门店数']),
        grid: gridOf(38),
        xAxis: xAxisMonth(labels.map(dShort)),
        yAxis: [yAxis('GMV', function (v) { return (v / 10000).toFixed(0) + '万'; }),
                yAxis('在营门店')],
        series: [
          { name: '月度 GMV', type: 'bar', data: (gS || []).map(function (x) { return Math.round(x); }),
            barMaxWidth: 26, itemStyle: { color: '#C62828', borderRadius: [3, 3, 0, 0] },
            markLine: covidMark(labels) },
          { name: '在营门店数', type: 'line', yAxisIndex: 1, data: aS, smooth: true, symbolSize: 5,
            lineStyle: { width: 2, color: '#EF6C00' }, itemStyle: { color: '#EF6C00' },
            areaStyle: { color: 'rgba(242,142,43,.08)' } }
        ]
      }));
    }
  };
};

/* ---- 页面 2：生命周期时间线 ---- */
RENDERERS.timeline = function (V) {
  var sts = storeStats(V);
  var lo = Math.min.apply(null, V.stores.map(function (s) { return s.mi0; }));
  var hi = Math.max.apply(null, V.stores.map(function (s) { return s.mi1; }));
  var labels = MONTHS.slice(lo, hi + 1);
  var order = sts.slice().sort(function (a, b) { return a.s.mi0 - b.s.mi0 || a.days - b.days; });

  // 甘特：offset + 长度
  // 在营门店数
  var aliveS = aliveCount(V.stores).slice(lo, hi + 1);
  // 关店归堆
  var byM = {};
  sts.forEach(function (x) {
    if (x.alive) return;
    var k = x.last.slice(0, 7);
    (byM[k] = byM[k] || []).push(x);
  });
  var closeKeys = Object.keys(byM).sort();

  // ---- 一图一结论 ----
  var deadS = sts.filter(function (x) { return !x.alive; });
  var preCovid = deadS.filter(function (x) { return x.last < COVID_CUT; }).length;
  var postCovid = deadS.length - preCovid;
  var mxClose = 0, mxCloseK = '';
  closeKeys.forEach(function (k) { if (byM[k].length > mxClose) { mxClose = byM[k].length; mxCloseK = k; } });
  var mxAlive = Math.max.apply(null, aliveS), mxAliveMi = aliveS.indexOf(mxAlive);
  var endAlive = aliveS.length ? aliveS[aliveS.length - 1] : 0;
  var endAliveReal = sts.filter(function (x) { return x.alive; }).length;

  var noteGantt = { level: preCovid > postCovid ? 'danger' : 'warn',
    text: deadS.length + ' 家停业门店中有 <b>' + preCovid + ' 家</b>在封城（' + COVID_CUT + '）之前就已关闭，' +
      '仅 <b>' + postCovid + ' 家</b>落在疫情之后 —— 关店潮早于疫情。' };
  var noteAlive = { level: endAlive <= 2 ? 'danger' : 'warn',
    text: '在营门店数 ' + MONTHS[lo + mxAliveMi] + ' 触顶 <b>' + mxAlive + ' 家</b>，此后单边下行，' +
      MONTHS[hi] + ' 只剩 <b>' + endAlive + ' 家</b>，其中仅 <b>' + endAliveReal + ' 家</b>存续至数据末。' };
  var noteClose = { level: 'warn',
    text: '关店高峰是 <b>' + (mxCloseK || '--') + '</b>（' + mxClose + ' 家），出现在疫情之前；疫情后的关店只是零星收尾。' };
  var noteTable = { level: 'info',
    text: '停业集中在 <b>' + Object.keys(byM).length + ' 个</b>月份：<b>' + preCovid + ' 家</b>为疫情前自主收缩、<b>' +
      postCovid + ' 家</b>在疫情之后。' };

  var html = shell('生命周期时间线',
    '每家门店从开业到停业的完整区间，叠加疫情节点 —— 关店到底发生在疫情之前还是之后。',
    '<div class="card"><div class="card-h"><div class="t">门店存续区间（甘特）</div>' +
    '<div class="s">横轴＝月份 · 色块＝在营区间 · 蓝＝蛙小辣 / 橙＝拌客 · 红虚线＝疫情节点</div></div>' +
    '<div class="chart xtall" id="tlGantt"></div>' + noteHTML(noteGantt) + '</div>' +
    '<div class="mt14 grid2">' +
      cardHTML('tlAlive', '在营门店数逐月变化', '峰值到归零的完整过程', 'tall', noteAlive) +
      cardHTML('tlClose', '关门月份分布', '每个月的关店数量', 'tall', noteClose) +
    '</div>' +
    '<div class="mt14"><div class="card"><div class="card-h"><div class="t">停业归堆明细</div>' +
    '<div class="s">按最后有数据月份聚合</div></div><div class="tbl-wrap"><table class="tbl">' +
    '<thead><tr><th>停业月份</th><th>家数</th><th>门店</th><th>与疫情的关系</th></tr></thead><tbody>' +
    closeKeys.map(function (k) {
      var arr = byM[k];
      var preN = arr.filter(function (x) { return x.last < COVID_CUT; }).length;
      var postN = arr.length - preN;
      var tag = postN === 0
        ? '<span class="surv-tag dead">疫情前</span> 属自主收缩'
        : (preN === 0
          ? '<span class="surv-tag" style="background:#FFF3D6;color:#8E5A00">疫情后</span> 叠加外部冲击'
          : '<span class="surv-tag dead">疫情前 ' + preN + ' 家</span> <span class="surv-tag" style="background:#FFF3D6;color:#8E5A00">疫情后 ' + postN + ' 家</span>');
      return '<tr><td><b>' + k + '</b></td><td class="num">' + arr.length + '</td>' +
        '<td style="white-space:normal;max-width:560px">' + arr.map(function (x) { return x.short; }).join('、') + '</td>' +
        '<td>' + tag + '</td></tr>';
    }).join('') +
    '</tbody></table></div></div>' + noteHTML(noteTable) + '</div>' +
    sumHTML(V, 'timeline')
  );

  return {
    html: html,
    init: function () {
      // 甘特图：x 轴必须是数值轴，否则 ECharts 会画成垂直柱、offset+stack 定位失效
      var cellOf = function (col) {
        return function (params, api) {
          var cat = api.value(0), s = api.value(1), e = api.value(2);
          var p1 = api.coord([s, cat]);
          var p2 = api.coord([e, cat]);
          var cw = api.size([1, 0])[0];
          var ch = api.size([0, 1])[1];
          var h = Math.max(9, ch * 0.46);
          var x0 = p1[0] - cw * 0.5, x1 = p2[0] + cw * 0.5;
          return {
            type: 'rect',
            shape: { x: x0, y: p1[1] - h / 2, width: Math.max(x1 - x0, 3), height: h, r: 2 },
            style: { fill: col, opacity: 0.92 },
            emphasis: { style: { fill: col, opacity: 1 } }
          };
        };
      };
      mount('tlGantt', Object.assign({
        tooltip: Object.assign(TIP, {
          trigger: 'item',
          formatter: function (p) {
            var x = order[p.value[0]];
            if (!x) return '';
            return '<b>' + x.name + '</b>（' + x.brand + ' · ' + x.area + '）<br/>' +
              '开业 ' + x.first + '<br/>停业 ' + x.last + '<br/>存活 ' + x.days + ' 天<br/>' +
              '累计 GMV ' + fMoneyRaw(x.m.gmv) + '<br/>月均实收 ' + fMoneyRaw(x.perMonthIncome);
          }
        }),
        legend: legendOf(BRANDS, { top: 4 }),
        grid: { left: 6, right: 28, top: 34, bottom: 4, containLabel: true },
        xAxis: { type: 'value', min: -0.5, max: labels.length - 0.5, interval: 1,
          axisLabel: { color: '#9C8A76', fontSize: 11,
            formatter: function (v) {
              var i = v + 0.5;
              return (Math.abs(i - Math.round(i)) < 1e-6 && labels[Math.round(i)])
                ? dShort(labels[Math.round(i)]) : '';
            } },
          axisLine: AXIS_LINE, axisTick: { show: false }, splitLine: { show: false } },
        yAxis: { type: 'category', data: order.map(function (x) { return x.short; }),
          axisLabel: AXIS_LABEL, axisLine: AXIS_LINE, axisTick: { show: false } },
        series: BRANDS.map(function (b, bi) {
          var col = BCOLOR[b] || '#9C8A76';
          var data = [];
          for (var q = 0; q < order.length; q++) {
            if (order[q].brand === b) data.push([q, order[q].s.mi0, order[q].s.mi1]);
          }
          var ser = { name: b, type: 'custom', renderItem: cellOf(col), data: data };
          if (bi === 0) ser.markLine = covidMark(labels);
          return ser;
        })
      }));
      mount('tlAlive', Object.assign({
        tooltip: tipItem(),
        legend: { show: false },
        grid: gridOf(20),
        xAxis: xAxisMonth(labels.map(dShort)),
        yAxis: yAxis('在营门店数'),
        series: [{
          type: 'line', data: aliveS, smooth: false, symbolSize: 6,
          lineStyle: { width: 2.5, color: '#C62828' }, itemStyle: { color: '#C62828' },
          areaStyle: { color: 'rgba(78,121,167,.12)' },
          label: { show: true, color: '#6D4C41', fontSize: 10, formatter: '{c}' },
          markLine: covidMark(labels)
        }]
      }));
      mount('tlClose', Object.assign({
        tooltip: tipItem(),
        legend: { show: false },
        grid: gridOf(20),
        xAxis: xAxisMonth(closeKeys.map(dShort)),
        yAxis: yAxis('停业家数'),
        series: [{
          type: 'bar', barMaxWidth: 34,
          data: closeKeys.map(function (k) {
            var arr = byM[k];
            return { value: arr.length, itemStyle: { color: k < '2020-01' ? '#C62828' : '#FBC02D', borderRadius: [3, 3, 0, 0] } };
          }),
          label: { show: true, position: 'top', color: '#6D4C41', fontSize: 11, formatter: '{c} 家' }
        }]
      }));
    }
  };
};

/* ---- 页面 3：扩张与关店节奏 ---- */
RENDERERS.expansion = function (V) {
  var sts = storeStats(V);
  var op = {}, cl = {};
  V.stores.forEach(function (s) {
    var a = s.first.slice(0, 7), b = s.last.slice(0, 7);
    (op[a] = op[a] || []).push(s); if (!s.alive) (cl[b] = cl[b] || []).push(s);
  });
  var keys = Array.from(new Set(Object.keys(op).concat(Object.keys(cl)))).sort();
  var cum = [], c = 0;
  keys.forEach(function (k) {
    c += (op[k] ? op[k].length : 0) - (cl[k] ? cl[k].length : 0);
    cum.push(c);
  });

  // 关店性质
  var trends = sts.filter(function (x) { return !x.alive; }).map(function (x) {
    return { x: x, t: closingTrend(x.si) };
  }).sort(function (a, b) { return a.x.last < b.x.last ? -1 : 1; });
  var grow = trends.filter(function (z) { return z.t && z.t.verdict === '增长中被终止'; }).length;
  var decay = trends.filter(function (z) { return z.t && z.t.verdict === '慢慢熄火'; }).length;
  var flatv = trends.filter(function (z) { return z.t && z.t.verdict === '平稳退出'; }).length;

  // ---- 一图一结论 ----
  var topOpenK = Object.keys(op).sort(function (a, b) { return op[b].length - op[a].length; })[0] || '';
  var topOpenN = topOpenK ? op[topOpenK].length : 0;
  var topCloseK = Object.keys(cl).sort(function (a, b) { return cl[b].length - cl[a].length; })[0] || '';
  var topCloseN = topCloseK ? cl[topCloseK].length : 0;
  var maxDays = Math.max.apply(null, sts.map(function (x) { return x.days; }));
  var minDays = Math.min.apply(null, sts.map(function (x) { return x.days; }));
  var chMax = 0;
  trends.forEach(function (z) { if (z.t && z.t.ch !== null && z.t.ch > chMax) chMax = z.t.ch; });

  var noteFlow = { level: 'danger',
    text: '<b>' + topOpenK + '</b> 单月开出 <b>' + topOpenN + ' 家</b>，紧接着 <b>' + topCloseK + '</b> 就停业 <b>' +
      topCloseN + ' 家</b> —— 扩张与关店只隔一个月，现金根本没时间回笼。' };
  var noteLife = { level: 'warn',
    text: '存活最短 <b>' + minDays + ' 天</b>、最长 <b>' + maxDays + ' 天</b>，相差 <b>' +
      Math.round(maxDays / (minDays || 1)) + ' 倍</b>，选址质量极不稳定。' };
  var noteTrend = { level: 'danger',
    text: trends.length + ' 家停业门店中 <b>' + grow + ' 家</b>在关店前 GMV 仍在上升（最高 <b>+' +
      (chMax * 100).toFixed(0) + '%</b>）—— 砍的是总部现金，不是经营不下去的门店。' };

  var html = shell('扩张与关店节奏',
    '把开业和停业放到同一根时间轴上对比 —— 扩张速度与关店速度哪个更快，以及关店是"认输"还是"被终止"。',
    kpiHTML([
      { label: '最快单月开店', value: Math.max.apply(null, Object.keys(op).map(function (k) { return op[k].length; })) + ' 家',
        note: '发生于 ' + Object.keys(op).sort(function (a, b) { return op[b].length - op[a].length; })[0] },
      { label: '最快单月关店', value: (Object.keys(cl).length ? Math.max.apply(null, Object.keys(cl).map(function (k) { return cl[k].length; })) : 0) + ' 家',
        note: '发生于 ' + (Object.keys(cl).sort(function (a, b) { return cl[b].length - cl[a].length; })[0] || '--') },
      { label: '增长中被终止', value: grow + ' 家', state: grow > 0 ? 'warn' : '',

function platStats(V) {
  return PLATFORMS.map(function (p, pi) {
    var sis = [];
    V.stores.forEach(function (s) { if (s.ids[p]) sis.push(s.si); });
    var set = {};
    sis.forEach(function (i) { set[i] = true; });
    var a = blankA(), i;
    // 必须同时按门店与平台过滤，否则会把该门店在另一平台的量也算进来
    for (i = 0; i < SHOP.length; i++) if (set[SHOP[i][1]] && SHOP[i][2] === pi) addShop(a, SHOP[i]);
    for (i = 0; i < CPC.length; i++) if (set[CPC[i][1]] && CPC[i][2] === pi) addCpc(a, CPC[i]);
    return { p: p, pi: pi, sis: sis, a: a, m: met(a), n: sis.length };
  });
}
function platMonthSeries(sis) {
  var set = {}; sis.forEach(function (i) { set[i] = true; });
  var out = PLATFORMS.map(function () { return MONTHS.map(function () { return 0; }); });
  var ord = PLATFORMS.map(function () { return MONTHS.map(function () { return 0; }); });
  for (var i = 0; i < SHOP.length; i++) {
    var r = SHOP[i];
    if (!set[r[1]]) continue;
    var mi = MIDX[DATES[r[0]].slice(0, 7)];
    out[r[2]][mi] += r[3];
    ord[r[2]][mi] += r[10];
  }
  return { gmv: out, orders: ord };
}

/* ---- 页面 6：单店剖析 ---- */

  if (ct) nodes.push({ d: '', c: '#EF6C00', t: '关店性质：' + ct.verdict,

  // ---- 一图一结论 ----

  var noteAov = { level: 'info',
    text: '客单价在 <b>¥' + fNum(aovMin) + '~¥' + fNum(aovMax) + '</b> 之间，' +
      (aovMin && aovMax / aovMin > 1.25 ? '波动明显，产品结构不稳定。' : '相对稳定，不是失败主因。') };
  var noteNodes = x.alive
    ? { level: 'ok', text: '存续至数据末（<b>' + s.days + ' 天</b>），是全盘唯一仍在营业的门店。' }
    : { level: 'info', text: '全周期 <b>' + s.days + ' 天</b>，GMV 峰值出现在第 <b>' + (peakMi - lo + 1) + ' 个月</b>；' +
        (ct ? '关店性质判定为「<b>' + ct.verdict + '</b>」。' : '') };
  var notePlat = platKeys.length > 1
    ? { level: 'info', text: perG.map(function (z) {
        return '<b>' + z.p + '</b> 占 ' + fPct(z.g) + '（实收率 ' + fPct(z.ir) + '）'; }).join('，') + '。' }
    : { level: 'warn', text: '该店仅接入 <b>' + (platKeys[0] || '—') + '</b>，流量来源单一，抗风险能力弱。' };

  var html = shell('单店剖析 · ' + x.short,
    x.brand + ' · ' + x.area + ' · ' + s.first + ' ~ ' + s.last + '（存活 ' + s.days + ' 天，日历 ' + s.cal + ' 天）' +
    ' · ' + (x.alive ? '存续至数据截止' : '翻车盘点') +
    ' · 平台接入：' + (x.plats.join(' / ') || '—'),
    '<div class="card"><div class="card-h"><div class="t">选择门店</div>' +
    '<div class="s">共 ' + sts.length + ' 家 · 点击切换 · 按存活天数降序</div></div>' +
    '<div style="padding:12px 14px"><div class="store-pick" id="storePick">' + chips + '</div></div></div>' +
    '<div class="mt14">' +
    kpiHTML([
      { label: '存活天数', value: s.days + ' 天', state: s.days < 90 ? 'bad' : (s.days < 180 ? 'warn' : ''),
        note: '日历 ' + s.cal + ' 天 · 首末 ' + s.first + ' / ' + s.last },
      { label: '招牌大单 · 累计GMV', value: fMoney(m.gmv), note: '有效订单 ' + fNum(m.valid) + ' 单' },
      { label: '日均流水', value: fMoneyRaw(x.perDay), state: x.perDay < 2000 ? 'bad' : 'warn',

      { label: '月均到手（商家实收）', value: fMoney(x.perMonthIncome, 1), state: x.perMonthIncome < 30000 ? 'bad' : 'warn',
        flag: x.perMonthIncome < 30000 ? '覆盖不了成本' : '', note: '上海快餐店月固定成本约 ¥3~6 万' },
      { label: '实收率', value: fPct(m.incomeRate), state: m.incomeRate < 0.5 ? 'bad' : 'warn',
        note: '补贴率 ' + fPct(m.subRate) },

    ]) + '</div>' +

    '</div>' +
    '<div class="grid2 mt14">' +
      cardHTML('stFunnel', '全周期漏斗 · 进店到下单', '曝光 → 进店 → 下单 → 有效订单', 'tall', noteFunnel) +
      cardHTML('stAov', '月度人均消费', '价格带的演变', 'tall', noteAov) +
    '</div>' +
    '<div class="mt14 grid2">' +
      '<div class="card"><div class="card-h"><div class="t">关键节点</div>' +

/* ---- 页面 7：归因与经验 ---- */
RENDERERS.verdict = function (V) {
  var sts = storeStats(V);
  var m = V.m;
  if (!sts.length) return { html: '<div class="empty">该品牌下暂无可分析的门店。</div>', init: function () {} };
  var chain = buildChain(V, sts);

  // ---- 经验清单（每条一句话，数字全部由当前筛选实时计算）----
  var medIncome = median(sts.map(function (x) { return x.perMonthIncome; }));
  var deadS = sts.filter(function (x) { return !x.alive; });
  var preCovid = deadS.filter(function (x) { return x.last < COVID_CUT; }).length;
  var grow = deadS.filter(function (x) {
    var t = closingTrend(x.si); return t && t.verdict === '增长中被终止';
  }).length;
  var opm = {};
  sts.forEach(function (x) { var k = x.first.slice(0, 7); (opm[k] = opm[k] || []).push(x); });
  var topOpenK = '', topOpenN = 0;
  Object.keys(opm).forEach(function (k) { if (opm[k].length > topOpenN) { topOpenN = opm[k].length; topOpenK = k; } });
  var areas = {};
  sts.forEach(function (x) { (areas[x.area] = areas[x.area] || []).push(x); });
  var maxArea = '', maxAreaN = 0;
  Object.keys(areas).forEach(function (k) { if (areas[k].length > maxAreaN) { maxAreaN = areas[k].length; maxArea = k; } });
  var best = sts.slice().sort(function (a, b) { return b.days - a.days; })[0];
  var pst = platStats(V);
  var cmRate = pst.length > 1 ? Math.abs(pst[0].m.commissionRate - pst[1].m.commissionRate) : 0;
  var irs = pst.map(function (z) { return z.m.incomeRate; });
  var irMin = Math.min.apply(null, irs), irMax = Math.max.apply(null, irs);

  var lessons = [
    { lv: 'danger', k: '商业模型',
      v: '补贴率压在 30% 以内，商家自掏不超过补贴总额的一半。本项目 <span class="hi">' + fPct(m.subRate) +
         '</span> / <span class="hi">' + fPct(m.mSubShare) + '</span>。' },
    { lv: 'danger', k: '单店模型',
      v: '开店前先用一家店验证「月实收 ≥ 固定成本」。本项目单店月均实收仅 <span class="hi">' + fMoneyRaw(medIncome) +
         '</span>，上海快餐店需 ¥3~6 万。' },
    { lv: 'danger', k: '扩张节奏',
      v: '单店模型跑通前不做多店同步扩张。本项目 <span class="hi">' + topOpenK + ' 单月开出 ' + topOpenN + ' 家</span>，' +
         '现金流没时间回笼。' },
    { lv: 'danger', k: '现金流',

  var scopeChips = scopeDefs(V).map(function (s) {

function momInit(V, sc, grain, live, serie) {

  });
  var isMoney = def.u === 'money';
  var isPct = def.u === 'pct' || def.u === 'pct2';
  var fmtBar = isMoney
    ? function (v) { return (v / 10000).toFixed(0) + '万'; }

  mount('momTrend', {

    { n: '商家自补贴', v: m.mSubRate, c: '#C62828' },

    { n: '平台佣金', v: m.commissionRate, c: '#6D4C41' }

  var noteSplit = { level: 'danger',
    text: '线上每 <b>¥100 流水</b>：商家实收 <b>¥' + (m.incomeRate * 100).toFixed(1) + '</b>、自己掏的补贴 <b>¥' +
      (m.mSubRate * 100).toFixed(1) + '</b>、平台掏 <b>¥' + (m.pSubRate * 100).toFixed(1) + '</b>、平台佣金 <b>¥' +
      (m.commissionRate * 100).toFixed(1) + '</b> —— 让利总额是实收的 <b>' + (m.incomeRate ? (m.subRate / m.incomeRate).toFixed(1) : '--') +

    '<div class="grid2">' +
      cardHTML('tkGap', '核心指标 · 离目标还有多远', '达成度 = 现状 ÷ 目标（越低越差的指标已做方向归一）', 'tall', noteGap) +
      cardHTML('tkTrend', '逐月追踪：进店率 / 下单率 / 实收率 vs 目标线', '灰度虚线为目标值 · ' + M.lastKey + ' 为最新实测月', 'tall', noteTrend) +
    '</div>' +
    '<div class="mt14"><div class="card"><div class="card-h"><div class="t">改善动作追踪台账</div>' +
      '<div class="s">基线取 ' + M.lastKey + ' 实测（单店项取门店中位数） · 每月回填一次</div></div>' +
      '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
      '<th>追踪指标</th><th>对应动作</th><th class="num">基线（执行前）</th><th class="num">目标</th>' +
      '<th class="num">达成度</th><th>状态</th><th>复查 / 数据来源</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>' + noteHTML(noteTable) + '</div></div>' +
    '<div class="mt14"><div class="card"><div class="card-h"><div class="t">闭环复核节奏</div>' +
      '<div class="s">追踪结果回流第\u2460步，形成 PDCA 闭环</div></div>' +
      '<div style="padding:13px 14px 14px">' + loopHTML +
      '<div style="margin-top:11px;font-size:12px;color:var(--text-2);line-height:1.7">' +
      '<b>执行节奏</b>：改善动作按上表频率回填读数；<b>任一项连续两期未向目标收敛</b>，即回到第\u2462步重新诊断，' +
      '而不是继续加码同一个动作。<b>每季度</b>把达成度快照留档一次，用于判断是「动作无效」还是「执行不到位」。</div>' +
      '</div></div></div>'
  ) + sumHTML(V, 'track');

  return {
    html: html,
    init: function () {
      /* ---- 图 1：达成度横向条形（从最紧到最松） ---- */
      var asc = M.byAch.slice().reverse();
      mount('tkGap', {
        tooltip: Object.assign(tipItem(), {
          formatter: function (a) {
            var x = M.byAch[M.byAch.length - 1 - a[0].dataIndex];
            return '<b>' + x.t.n + '</b><br/>现状：' + tkFmt(x.t.u, x.base) +
              '<br/>目标：' + tkFmt(x.t.u, x.t.tgt) + '<br/>达成度：' + fPct(x.ach, 0) +
              '<br/><span style="color:#9C8A76">' + x.t.act + '</span>';
          }
        }),
        grid: { left: 6, right: 62, top: 16, bottom: 6, containLabel: true },
        xAxis: { type: 'value', max: 1.4, axisLabel: Object.assign({}, AXIS_LABEL,
          { formatter: function (v) { return (v * 100).toFixed(0) + '%'; } }),
          axisLine: { show: false }, axisTick: { show: false }, splitLine: SPLIT_LINE },
        yAxis: { type: 'category', inverse: true, data: asc.map(function (x) { return x.t.n; }),
          axisLabel: Object.assign({}, AXIS_LABEL, { fontSize: 11 }),
          axisLine: AXIS_LINE, axisTick: { show: false } },
        series: [{
          type: 'bar', barWidth: 13,
          data: asc.map(function (x) { return +x.ach.toFixed(3); }),
          itemStyle: { color: function (p) { return TK_COLOR[asc[p.dataIndex].st]; }, borderRadius: [0, 3, 3, 0] },
          label: { show: true, position: 'right', fontSize: 11, color: '#6D4C41',
            formatter: function (p) { return fPct(p.value, 0); } },
          markLine: { silent: true, symbol: 'none',
            lineStyle: { color: '#9C8A76', type: 'dashed', width: 1 },
            label: { formatter: '目标 100%', position: 'end', fontSize: 10, color: '#9C8A76' },
            data: [{ xAxis: 1 }] }
        }]
      });

      /* ---- 图 2：逐月走势 vs 目标线 ---- */
      var keys = [], rInc = [], rVis = [], rOrd = [];
      var sc2 = scopeResolve(view(), 'all');
      PERIODS.m.forEach(function (p, i) {
        var v = periodAgg('m', sc2, i, i);
        if (!v.gmv) return;
        keys.push(p.key.slice(2));
        rInc.push(+(v.incomeRate * 100).toFixed(2));
        rVis.push(+(v.visitRate * 100).toFixed(2));
        rOrd.push(+(v.orderRate * 100).toFixed(2));
      });
      function withTgt(name, data, color, tgt, tgtTxt) {
        return {
          name: name, type: 'line', smooth: true, symbolSize: 5, data: data,
          lineStyle: { width: 2, color: color }, itemStyle: { color: color },
          markLine: { silent: true, symbol: 'none',
            lineStyle: { color: color, type: 'dashed', width: 1, opacity: .55 },
            label: { formatter: tgtTxt + ' 目标', position: 'insideEndTop', fontSize: 10, color: color },
            data: [{ yAxis: tgt }] }
        };
      }
      mount('tkTrend', {
        tooltip: Object.assign(tipItem(), {
          formatter: function (a) {
            var s = a[0].axisValue + '<br/>';
            a.forEach(function (it) { s += it.marker + it.seriesName + '：' + (+it.value).toFixed(2) + '%<br/>'; });
            return s;
          }
        }),
        legend: legendOf(['进店率', '下单率', '实收率']),
        grid: gridOf(46),
        xAxis: xAxisMonth(keys),
        yAxis: yAxis('%', function (v) { return v.toFixed(0) + '%'; }),
        series: [
          withTgt('进店率', rVis, '#8E5B2B', 9.0, '9%'),
          withTgt('下单率', rOrd, '#EF6C00', 25.0, '25%'),
          withTgt('实收率', rInc, '#C62828', 45.0, '45%')
        ]
      });
    }
  };
};

/* ==========================================================================
   7. 状态、路由与交互
   ========================================================================== */
var STATE = { brand: 'ALL', page: 'overview', store: null };

function parseHash() {
  var h = location.hash.replace(/^#/, '');
  var p = h.split('?');
  var q = { page: p[0] || null, brand: null, store: null };
  if (p[1]) {
    p[1].split('&').forEach(function (kv) {
      var a = kv.split('=');
      if (a[0] === 'b' && a[1]) q.brand = decodeURIComponent(a[1]);
      if (a[0] === 's' && a[1] !== undefined && a[1] !== '') {
        var v = parseInt(a[1], 10);
        if (!isNaN(v)) q.store = v;
      }
    });
  }
  return q;
}
function syncHash() {
  var h = '#' + STATE.page, qs = [];
  if (STATE.brand !== 'ALL') qs.push('b=' + encodeURIComponent(STATE.brand));
  if (STATE.store != null) qs.push('s=' + STATE.store);
  if (qs.length) h += '?' + qs.join('&');
  if (location.hash !== h) location.hash = h;
}
function updateStamp() {
  var el = document.getElementById('tbSub');
  if (el) el.textContent = DATES[0].slice(0, 7) + ' ~ ' + DATES[DATES.length - 1].slice(0, 7) +
    ' · ' + STORES.length + ' 家门店';
  var sn = document.getElementById('srcNote');
  if (sn) sn.textContent = '基于 shop.csv / cpc.csv 真实数据 · ' + PLATFORMS.join(' / ') +
    ' · ' + BRANDS.length + ' 个品牌 · 生成于 ' + (D.generatedAt || '—');
}
function renderBrand() {
  var h = '<button class="brand-btn' + (STATE.brand === 'ALL' ? ' on' : '') + '" data-brand="ALL">' +
    '<span class="dot" style="background:#9C8A76"></span>全部品牌<span class="cnt">' + STORES.length + ' 家</span></button>';
  BRANDS.forEach(function (b) {
    var sts = STORES.filter(function (s) { return s.brand === b; });
    h += '<button class="brand-btn' + (STATE.brand === b ? ' on' : '') + '" data-brand="' + b + '">' +
      '<span class="dot" style="background:' + (BCOLOR[b] || '#9C8A76') + '"></span>' + b +
      '<span class="cnt">' + sts.length + ' 家</span></button>';
  });
  document.getElementById('brandList').innerHTML = h;
}
function renderNav() {
  var h = '';
  STAGES.forEach(function (st, si) {
    h += '<div class="nav-stage' + (si === 0 ? ' first' : '') + '">' +
      '<span class="nn">' + CN_NUM[st.no] + '</span>' +
      '<span class="nm">' + st.name + '</span>' +
      '<span class="ns">' + st.sub + '</span></div>';
    PAGES.forEach(function (p) {
      if (p.stage !== si) return;
      h += '<button class="nav-btn' + (STATE.page === p.key ? ' on' : '') + '" data-page="' + p.key + '">' +
        '<span class="ni">' + p.icon + '</span>' + p.name + '</button>';
    });
  });
  document.getElementById('navList').innerHTML = h;
}
/* 顶栏「分析主线」五步进度条 */
function renderStory() {
  var bar = document.getElementById('storyBar');
  if (!bar) return;
  var cur = pageStage(STATE.page);
  var h = '<div class="sb-in"><span class="sb-cap">分析主线</span>';
  STAGES.forEach(function (st, i) {
    var cls = 'sb-step' + (i === cur ? ' on' : (i < cur ? ' done' : ''));
    h += '<button class="' + cls + '" data-stage="' + i + '" title="' + st.name + ' · ' + st.sub + '">' +
      '<i>' + CN_NUM[st.no] + '</i><b>' + st.name + '</b><em>' + st.sub + '</em></button>';
    if (i < STAGES.length - 1) h += '<span class="sb-arrow">\u25B6</span>';
  });
  h += '<span class="sb-loop">\u21BA 追踪结果回流第\u2460步复核</span></div>';
  bar.innerHTML = h;
}
/* 顶栏 + 主线栏的实际高度写进 CSS 变量，供侧栏吸顶偏移使用 */
function syncTopH() {
  var tb = document.querySelector('.topbar');
  var sb = document.getElementById('storyBar');
  var root = document.documentElement;
  root.style.setProperty('--topH', (tb ? Math.round(tb.getBoundingClientRect().height) : 58) + 'px');
  root.style.setProperty('--storyH', (sb ? Math.round(sb.getBoundingClientRect().height) : 0) + 'px');
}
function bindStory() {
  var bar = document.getElementById('storyBar');
  if (!bar || bar.__bound) return;
  bar.__bound = 1;
  bar.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-stage]') : null;
    if (!t) return;
    var si = +t.getAttribute('data-stage');
    var st = STAGES[si];
    if (!st) return;
    var pg = st.lead;
    if (!RENDERERS[pg]) {
      for (var i = 0; i < PAGES.length; i++) if (PAGES[i].stage === si && RENDERERS[PAGES[i].key]) { pg = PAGES[i].key; break; }
    }
    if (!pg || pg === STATE.page) return;
    STATE.page = pg; STATE.store = null;
    syncHash(); renderNav(); renderCurrent(true);
  });
  window.addEventListener('resize', function () { clearTimeout(bindStory._t); bindStory._t = setTimeout(syncTopH, 160); });
}

function renderCurrent(scrollTop) {
  var V = view(), r;
  try {
    r = RENDERERS[STATE.page](V);
  } catch (e) {
    console.error(e);
    r = { html: '<div class="fail">页面渲染失败：' + (e && e.message) + '</div>', init: function () {} };
  }
  disposeAll();
  var main = document.getElementById('main');
  main.innerHTML = r.html;
  // 结论前置：在页面头之后插入「核心结论」块（BLUF）
  try {
    var _lead = leadHTML(STATE.page, V);
    if (_lead) {
      var _ph = main.querySelector('.pg-head');
      if (_ph && _ph.insertAdjacentHTML) _ph.insertAdjacentHTML('afterend', _lead);
      else main.insertAdjacentHTML('afterbegin', _lead);
    }
  } catch (e) { console.error(e); }
  renderStory();
  // 强制完成一次布局，确保图表容器已有真实宽高（同步 init 时若尺寸为 0 会画错）
  void main.offsetHeight;
  // 同步初始化图表：rAF 回调会堆积并作用在已被替换的 DOM 上，导致图表静默不渲染
  try { r.init(); } catch (e) { console.error(e); }
  resizeAll();
  // 下一帧再校正一次尺寸（字体/滚动条引起的布局回落）
  requestAnimationFrame(function () { resizeAll(); });
  if (scrollTop) window.scrollTo({ top: 0, behavior: 'smooth' });
}
function reloadData() {
  var ns = document.createElement('script');
  ns.src = 'dashboard-data.js?t=' + Date.now();
  ns.onload = function () {
    if (initData()) {
      updateStamp(); renderBrand(); renderStory(); syncTopH(); renderNav(); renderCurrent(false);
      flashBtn('数据已重新加载 · ' + (D.generatedAt || ''));
    } else {
      flashBtn('数据格式异常');
    }
    ns.parentNode.removeChild(ns);
  };
  ns.onerror = function () { flashBtn('加载 dashboard-data.js 失败'); };
  document.body.appendChild(ns);
}
function flashBtn(msg) {
  var b = document.getElementById('reloadBtn');
  if (!b) return;
  var old = b.textContent;
  b.textContent = msg;
  b.disabled = true;
  setTimeout(function () { b.textContent = old; b.disabled = false; }, 1800);
}
function bindEvents() {
  document.getElementById('brandList').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.brand-btn') : null;
    if (!b) return;
    var k = b.getAttribute('data-brand');
    if (k === STATE.brand) return;
    STATE.brand = k; STATE.store = null;
    syncHash(); renderBrand(); renderCurrent(true);
  });
  document.getElementById('navList').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.nav-btn') : null;
    if (!b) return;
    var k = b.getAttribute('data-page');
    if (k === STATE.page) return;
    STATE.page = k;
    syncHash(); renderNav(); renderCurrent(true);
  });
  var rb = document.getElementById('reloadBtn');
  if (rb) rb.addEventListener('click', reloadData);
  var rt = null;
  window.addEventListener('resize', function () {
    clearTimeout(rt); rt = setTimeout(resizeAll, 160);
  });
  window.addEventListener('hashchange', function () {
    var q = parseHash();
    if (q.page === STATE.page && q.brand === STATE.brand && q.store === STATE.store) return;
    if (q.page && RENDERERS[q.page]) STATE.page = q.page;
    if (q.brand) STATE.brand = q.brand;
    STATE.store = q.store;
    renderBrand(); renderNav(); renderCurrent(false);
  });
}
function boot() {
  if (!initData()) {
    document.getElementById('main').innerHTML =
      '<div class="fail">未找到 <code>dashboard-data.js</code> 或格式不正确。<br/>' +
      '请先运行 <code>build_data.py</code> 生成数据文件，并确保它与本页面放在同一目录下。</div>';
    return;
  }
  var q = parseHash();
  if (q.page && RENDERERS[q.page]) STATE.page = q.page;
  if (q.brand && (q.brand === 'ALL' || BRANDS.indexOf(q.brand) >= 0)) STATE.brand = q.brand;
  STATE.store = q.store;
  updateStamp(); renderBrand(); renderStory(); bindStory(); syncTopH(); renderNav(); renderCurrent(false); bindEvents();
  setTimeout(syncTopH, 300);
  window.__DASH_READY = true;
}
boot();
</script>
